; Course video uploads — effectively unlimited for LMS use (100 GB ceiling).
; Real limit = free disk + web-server body size (nginx client_max_body_size / LiteSpeed).
; On XAMPP/Apache mod_php, mirror these in php.ini and restart Apache.
upload_max_filesize = 102400M
post_max_size = 102400M
max_execution_time = 0
max_input_time = -1
memory_limit = 2048M
