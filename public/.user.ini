; Raise PHP upload limits for large course videos (up to 5 GB).
; Applies when PHP runs as CGI/FPM with .user.ini support (many shared hosts).
; On XAMPP/Apache mod_php, also set the same values in php.ini and restart Apache.
upload_max_filesize = 5120M
post_max_size = 5120M
max_execution_time = 3600
max_input_time = 3600
memory_limit = 2048M
