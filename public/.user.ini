; Raise PHP upload limits for large course videos (legacy LMS allows up to ~2GB).
; Applies when PHP runs as CGI/FPM with .user.ini support (many shared hosts).
; On XAMPP/Apache mod_php, also set the same values in php.ini and restart Apache.
upload_max_filesize = 2048M
post_max_size = 2048M
max_execution_time = 600
max_input_time = 600
memory_limit = 1024M
